<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', filename='images/logo.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>{% block title %}{% endblock %}</title>
</head> 
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary p-2 navbar-fixed">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="logo">
          &nbsp;&nbsp;<b>TaskFlow</b>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link {% if active_page == 'home' %} active {% endif %}" aria-current="page" href="/">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if active_page == 'features' %} active {% endif %}" href="/features">Features</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if active_page == 'ai' %} active {% endif %}" href="/ai-hub">AI</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if active_page == 'pricing' %} active {% endif %}" href="/pricing">Pricing</a>
          </li>
          <li class="nav-item">
            <a class="nav-link disabled enjoy-link" href="#" tabindex="-1" aria-disabled="true" title="Coming soon!">
              <i class="fas fa-star me-1"></i> mr_sam
            </a>
          </li>          
        </ul>
        <form class="d-flex">
          <a href="/auth/login"><button class="btn btn-secondary" type="button">Login</button></a>
          &nbsp;&nbsp;
          <a href="/auth/signup"><button class="btn btn-outline-light" type="button">Get Started</button></a>
        </form>
      </div>
    </div>
  </nav>
  <div class="content">
    {% block content %}{% endblock %}
  </div>

  <style>
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
  }
  .enjoy-link {
    color: #aaa !important;
    cursor: not-allowed;
    position: relative;
    font-weight: 600;
    opacity: 0.7;
    pointer-events: none; /* Fully disables it */
    background: linear-gradient(to right, #f6d365 0%, #fda085 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    transition: opacity 0.3s ease;
  }
  
  .enjoy-link:hover {
    opacity: 1;
    text-shadow: 0 0 5px rgba(255, 166, 0, 0.5);
  }
  
  </style>

  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
