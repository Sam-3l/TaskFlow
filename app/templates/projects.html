{% extends 'parents/auth_base.html' %}
{% block title %}{{ user["fname"] }} | Projects{% endblock %}

{% block content %}

<div class="container-fluid projects">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 text-dark mb-0">Your Projects</h1>
        <div class="dropdown">
            <button class="btn btn-outline-primary dropdown-toggle" type="button" id="sortDropdown" data-bs-toggle="dropdown">
                Sort by
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="#">Priority</a></li>
                <li><a class="dropdown-item" href="#">Deadline</a></li>
                <li><a class="dropdown-item" href="#">Last Modified & Status</a></li>
            </ul>
        </div>
    </div>

    <p>Coming soon</p>
    Project page in development
    
<div>

<a href="/dashboard/projects/new" class="btn btn-primary btn-lg floating-action-button shadow">
    <i class="fas fa-plus"></i>
</a>

<style>
    .projects{
        margin-top: 100px;
        padding-left: 3rem;
        padding-right: 3rem;
    }
</style>

{% endblock %}
